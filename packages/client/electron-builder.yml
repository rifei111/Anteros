appId: com.anteros.app
productName: Anteros
copyright: Copyright © 2026 rifei111
# electron-builder 不接受 ^ 版本范围（它要按确切版本下载平台二进制），显式钉死实际安装版本。
electronVersion: 45.0.0
# 本机 GitHub releases 不可达，electron-builder 无法在线拉取 electron 平台二进制（会卡在
# @electron/get 下载 SHASUMS256.txt 后抛 emitErrorCloseNT）。直接复用已安装的 electron 解包目录，
# 完全跳过下载。
electronDist: ../../node_modules/electron/dist
directories:
  output: ../../release
  buildResources: build
files:
  - out/**/*
  - package.json
  - "!**/*.map"
extraResources:
  - from: ../kernel/dist
    to: kernel
  - from: ../../plugins
    to: plugins
asar: true
asarUnpack:
  - resources/**
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  artifactName: Anteros-Setup-${version}-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Anteros
  uninstallDisplayName: Anteros
  license: ../../LICENSE
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  runAfterFinish: true
# 应用内更新（electron-updater）的发布源：打包时会据此生成 resources/app-update.yml，
# 并额外产出 latest.yml 与 *.exe.blockmap（差分更新清单）。不配这个，界面点「检查更新」永远失败。
publish:
  provider: github
  owner: rifei111
  repo: Anteros
  releaseType: release
