<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self' data:; connect-src 'self' ws: http: https:"
    />
    <meta name="color-scheme" content="light dark" />
    <title>Anteros</title>
    <script>
      // 首帧前定主题：默认跟随系统；用户选过亮/暗就按选择来。规则与 lib/theme.ts 一致。
      (() => {
        try {
          const choice = localStorage.getItem("anteros.theme");
          const dark =
            choice === "dark" ||
            (choice !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
        } catch {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
